<style>
:root{--bg:#f5f7fb;--nav:#0d2442;--blue:#2567d4;--ink:#14243d;--muted:#6b7a90;--line:#dbe3ed;--green:#177b55;--red:#bd3c44}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{background:linear-gradient(145deg,#0d2442,#153a68);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:46px;line-height:1.08;margin:12px 0}.hero p{color:#d4dfed;font-size:18px;line-height:1.55}.side{display:grid;place-items:center;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(15,35,65,.08)}.login{width:min(450px,100%);padding:30px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#4a76bd}.login h2{margin:8px 0}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:800}.input{height:44px;border:1px solid #cad5e2;border-radius:10px;padding:0 12px;width:100%;outline:none}.input:focus{border-color:#7ba8ea;box-shadow:0 0 0 3px rgba(37,103,212,.1)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f8;color:#29425f}.full{width:100%}.links{display:flex;justify-content:space-between;margin-top:12px}.link{border:0;background:none;color:var(--blue);font-weight:800;cursor:pointer}.msg{padding:10px;border-radius:9px;margin:10px 0;font-size:13px}.err{background:#fff0f1;color:#a12b34}.ok{background:#eaf8f1;color:#126a48}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.nav{background:var(--nav);color:white;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 22px;font-weight:900;font-size:18px}.nav button{border:0;background:transparent;color:#cbd8e7;padding:11px;border-radius:10px;text-align:left;font-weight:800;cursor:pointer;margin:3px 0}.nav button.active,.nav button:hover{background:#153457;color:#fff}.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 10px;font-size:12px;color:#9fb1c8}.main{padding:32px;min-width:0}.header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.header h1{margin:4px 0}.header p{margin:0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{padding:17px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:3px}.panel{padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:13px}.search{flex:1;min-width:220px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{min-width:820px}.row,.head{display:grid;grid-template-columns:2fr .7fr 1.3fr .6fr .6fr;padding:11px 13px;gap:10px;align-items:center}.head{background:#f7f9fc;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase}.row{border-top:1px solid #edf1f6}.name strong{display:block}.name small{color:var(--muted)}.status{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.present.on{background:#e8f7ef;color:var(--green);border-color:#b5dfc9}.absent.on{background:#fff0f1;color:var(--red);border-color:#efb8bd}.green{color:var(--green);font-weight:900}.red{color:var(--red);font-weight:900}.tabs{display:flex;gap:5px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.tabs button.on{background:#eaf2ff;color:#1c5bac}.modalbg{position:fixed;inset:0;background:rgba(10,20,35,.5);display:grid;place-items:center;padding:16px}.modal{width:min(500px,100%);padding:24px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:11px 13px;border-radius:10px;background:#fff7e5;color:#7b5617;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.simple .row,.simple .head{grid-template-columns:2fr .7fr .8fr .7fr 1.2fr}.report .row,.report .head{grid-template-columns:2fr .7fr .7fr .8fr .8fr}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings .card{padding:20px}.days{display:flex;gap:6px;flex-wrap:wrap}.days button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;cursor:pointer}.days button.on{background:#eaf2ff;color:#1c5bac}.mobile{display:none}
@media(max-width:900px){.auth{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.nav{display:none}.mobile{display:flex;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px;gap:5px;overflow:auto}.mobile button{white-space:nowrap;border:0;background:#edf2f8;border-radius:8px;padding:8px}.main{padding:18px}.metrics{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr}}
@media(max-width:520px){.metrics{grid-template-columns:1fr}.header{align-items:start;flex-direction:column}.two{grid-template-columns:1fr}}
</style>

<body>
<div id="app"></div>
<script>
var SB="https://wzbckuyxvasuudkzxbiq.supabase.co";
var KEY="sb_publishable_zhqhtiMb9UL0Fcx7S2wowA_RRmYXp3W";
var S={token:null,refresh:null,user:null,member:null,settings:null,view:"attendance",date:today(),month:today().slice(0,7),patients:[],entries:[],monthEntries:[]};
function $(q,r){return (r||document).querySelector(q)}function $$(q,r){return Array.from((r||document).querySelectorAll(q))}
function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function hdr(){return {"apikey":KEY,"Authorization":"Bearer "+(S.token||KEY),"Content-Type":"application/json"}}
async function req(path,opt){opt=opt||{};var r=await fetch(SB+path,{method:opt.method||"GET",headers:Object.assign(hdr(),opt.headers||{}),body:opt.body});if(!r.ok){var m="Erro na operação";try{var j=await r.json();m=j.message||j.msg||j.error_description||j.error||j.details||m}catch(x){}throw new Error(m)}if(r.status===204)return null;var t=await r.text();return t?JSON.parse(t):null}
function save(a){if(a){S.token=a.access_token;S.refresh=a.refresh_token;localStorage.setItem("cp-session",JSON.stringify(a))}else{S.token=S.refresh=null;localStorage.removeItem("cp-session")}}
async function user(){try{return await req("/auth/v1/user")}catch(x){save(null);return null}}
function msg(id,text,ok){$(id).innerHTML='<div class="msg '+(ok?"ok":"err")+'">'+e(text)+'</div>'}
async function boot(){var raw=localStorage.getItem("cp-session");if(raw){try{var x=JSON.parse(raw);S.token=x.access_token;S.refresh=x.refresh_token}catch(z){}}S.user=await user();if(!S.user)return auth();var m=await req("/rest/v1/clinic_members?select=clinic_id,role,clinics(name)&user_id=eq."+encodeURIComponent(S.user.id)+"&limit=1");S.member=m&&m[0];if(!S.member)return onboarding();var st=await req("/rest/v1/clinic_settings?select=timezone,operating_weekdays&clinic_id=eq."+S.member.clinic_id+"&limit=1");S.settings=st&&st[0]||{timezone:"America/Sao_Paulo",operating_weekdays:[1,2,4,5]};shell();loadView()}
function auth(){document.getElementById("app").innerHTML='<div class="auth"><div class="hero"><div class="eyebrow" style="color:#8fc1ff">Rotina clínica organizada</div><h1>Presenças e faltas sem várias planilhas.</h1><p>Cadastre pacientes uma vez, registre cada atendimento e acompanhe o histórico automaticamente.</p></div><div class="side"><div class="card login"><div class="eyebrow">Acesso restrito</div><h2 id="at">Entrar na plataforma</h2><p id="ad">Use as credenciais autorizadas.</p><div id="am"></div><div class="field"><label>E-mail</label><input id="email" class="input" type="email"></div><div class="field" id="pf"><label>Senha</label><input id="pass" class="input" type="password" minlength="10"></div><button id="go" class="btn primary full">Entrar</button><div class="links"><button id="rec" class="link">Esqueci a senha</button><button id="sign" class="link">Criar primeiro acesso</button></div></div></div></div>';var mode="login";$("#sign").onclick=function(){mode=mode==="signup"?"login":"signup";$("#at").textContent=mode==="login"?"Entrar na plataforma":"Criar primeiro acesso";$("#go").textContent=mode==="login"?"Entrar":"Criar conta";$("#sign").textContent=mode==="login"?"Criar primeiro acesso":"Voltar"};$("#rec").onclick=function(){mode="recover";$("#at").textContent="Recuperar senha";$("#pf").classList.add("hidden");$("#go").textContent="Enviar instruções"};$("#go").onclick=async function(){var email=$("#email").value.trim(),pass=$("#pass").value;if(!email)return;try{if(mode==="login"){var r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:hdr(),body:JSON.stringify({email:email,password:pass})});var j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||"Falha no login");save(j);boot()}else if(mode==="signup"){var rr=await fetch(SB+"/auth/v1/signup",{method:"POST",headers:hdr(),body:JSON.stringify({email:email,password:pass})});var jj=await rr.json();if(!rr.ok)throw new Error(jj.msg||"Falha ao criar conta");if(jj.access_token){save(jj);boot()}else msg("#am","Conta criada. Confirme o e-mail e depois faça login.",true)}else{await fetch(SB+"/auth/v1/recover",{method:"POST",headers:hdr(),body:JSON.stringify({email:email})});msg("#am","Se o e-mail existir, as instruções foram enviadas.",true)}}catch(x){msg("#am",x.message,false)}}}
function onboarding(){document.getElementById("app").innerHTML='<div class="side" style="min-height:100vh"><div class="card login"><div class="eyebrow">Configuração inicial</div><h2>Criar a clínica</h2><p>Somente o primeiro usuário autenticado consegue inicializar este banco.</p><div id="om"></div><div class="field"><label>Nome da clínica</label><input id="cn" class="input" maxlength="120"></div><button id="cc" class="btn primary full">Criar ambiente</button><button id="lo" class="link" style="margin-top:12px">Sair</button></div></div>';$("#cc").onclick=async function(){try{await req("/rest/v1/rpc/create_clinic_and_owner",{method:"POST",body:JSON.stringify({clinic_name:$("#cn").value.trim()})});boot()}catch(x){msg("#om",x.message,false)}};$("#lo").onclick=logout}
function cname(){var c=S.member.clinics;return Array.isArray(c)?(c[0]&&c[0].name)||"Clínica":(c&&c.name)||"Clínica"}
function shell(){document.getElementById("app").innerHTML='<div class="shell"><aside class="nav"><div class="brand">'+e(cname())+'</div><button data-v="attendance">✓ Presenças</button><button data-v="patients">👥 Pacientes</button><button data-v="reports">▥ Relatórios</button><button data-v="settings">⚙ Configurações</button><div class="who">'+e(S.user.email||"")+'<br>'+e(S.member.role)+'<br><button id="out" class="link" style="color:#fff;padding:8px 0">Sair</button></div></aside><div><div class="mobile"><button data-v="attendance">Presenças</button><button data-v="patients">Pacientes</button><button data-v="reports">Relatórios</button><button data-v="settings">Config.</button></div><main class="main" id="main"></main></div></div>';$$("[data-v]").forEach(function(b){b.onclick=function(){S.view=b.dataset.v;active();loadView()}});$("#out").onclick=logout;active()}
function active(){$$("[data-v]").forEach(function(b){b.classList.toggle("active",b.dataset.v===S.view)})}
async function logout(){try{await req("/auth/v1/logout",{method:"POST"})}catch(x){}save(null);S.user=null;auth()}
function bounds(v){var a=v.slice(0,7).split("-").map(Number);return {s:v.slice(0,7)+"-01",n:new Date(Date.UTC(a[0],a[1],1)).toISOString().slice(0,10)}}
async function getPatients(all){var f=all?"":"&active=eq.true&start_date=lte."+S.date;return await req("/rest/v1/patients?select=id,full_name,phone,default_time,start_date,active&clinic_id=eq."+S.member.clinic_id+f+"&order=full_name.asc")}
async function loadView(){try{if(S.view==="attendance")await attendance();if(S.view==="patients")await patients();if(S.view==="reports")await reports();if(S.view==="settings")settings()}catch(x){$("#main").innerHTML='<div class="msg err">'+e(x.message)+'</div>'}}
async function attendance(){var b=bounds(S.date),a=await Promise.all([getPatients(false),req("/rest/v1/attendance_entries?select=patient_id,status,attendance_date&clinic_id=eq."+S.member.clinic_id+"&attendance_date=eq."+S.date),req("/rest/v1/attendance_entries?select=patient_id,status&clinic_id=eq."+S.member.clinic_id+"&attendance_date=gte."+b.s+"&attendance_date=lt."+b.n)]);S.patients=a[0]||[];S.entries=a[1]||[];S.monthEntries=a[2]||[];drawAttendance()}
function drawAttendance(){var map={},tot={};S.entries.forEach(function(x){map[x.patient_id]=x.status});S.monthEntries.forEach(function(x){if(!tot[x.patient_id])tot[x.patient_id]={present:0,absent:0};tot[x.patient_id][x.status]++});var p=S.entries.filter(function(x){return x.status==="present"}).length,f=S.entries.filter(function(x){return x.status==="absent"}).length,r=p+f?Math.round(p/(p+f)*100):0;var h='<div class="header"><div><div class="eyebrow">Controle diário</div><h1>Presenças</h1><p>'+e(S.date.split("-").reverse().join("/"))+'</p></div><div style="display:flex;gap:7px"><input id="dt" class="input" type="date" value="'+S.date+'"><button id="open" class="btn secondary">Abrir</button></div></div><div class="metrics"><div class="card metric"><span>Pacientes</span><strong>'+S.patients.length+'</strong></div><div class="card metric"><span>Presentes</span><strong>'+p+'</strong></div><div class="card metric"><span>Faltas</span><strong>'+f+'</strong></div><div class="card metric"><span>Comparecimento</span><strong>'+r+'%</strong></div></div><section class="card panel"><div class="toolbar"><input id="qs" class="input search" placeholder="Pesquisar paciente"><button id="np" class="btn primary">+ Novo paciente</button></div><div class="tablewrap"><div class="table"><div class="head"><div>Paciente</div><div>Horário</div><div>Status</div><div>Presenças</div><div>Faltas</div></div><div id="rows"></div></div></div></section>';$("#main").innerHTML=h;function rows(){var q=$("#qs").value.toLowerCase();$("#rows").innerHTML=S.patients.filter(function(x){return !q||x.full_name.toLowerCase().includes(q)}).map(function(x){var t=tot[x.id]||{present:0,absent:0},st=map[x.id];return '<div class="row"><div class="name"><strong>'+e(x.full_name)+'</strong><small>'+e(x.phone||"Telefone não informado")+'</small></div><div>'+e((x.default_time||"").slice(0,5)||"—")+'</div><div><button class="status present '+(st==="present"?"on":"")+'" data-id="'+x.id+'" data-s="present">Presente</button> <button class="status absent '+(st==="absent"?"on":"")+'" data-id="'+x.id+'" data-s="absent">Falta</button></div><div class="green">'+t.present+'</div><div class="red">'+t.absent+'</div></div>'}).join("");$$("[data-s]").forEach(function(b){b.onclick=function(){mark(b.dataset.id,b.dataset.s,map[b.dataset.id])}})}$("#qs").oninput=rows;$("#open").onclick=function(){S.date=$("#dt").value||S.date;attendance()};$("#np").onclick=function(){modal(null,attendance)};rows()}
async function mark(id,n,c){try{if(n===c)await req("/rest/v1/attendance_entries?clinic_id=eq."+S.member.clinic_id+"&patient_id=eq."+id+"&attendance_date=eq."+S.date,{method:"DELETE"});else await req("/rest/v1/attendance_entries?on_conflict=patient_id,attendance_date",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({clinic_id:S.member.clinic_id,patient_id:id,attendance_date:S.date,status:n})});attendance()}catch(x){alert(x.message)}}
function modal(p,done){var d=document.createElement("div");d.className="modalbg";d.innerHTML='<div class="card modal"><h2>'+(p?"Editar paciente":"Novo paciente")+'</h2><div id="mm"></div><div class="field"><label>Nome completo</label><input id="mn" class="input" value="'+e(p&&p.full_name||"")+'"></div><div class="two"><div class="field"><label>Telefone</label><input id="mp" class="input" value="'+e(p&&p.phone||"")+'"></div><div class="field"><label>Horário</label><input id="mt" class="input" type="time" value="'+e(p&&p.default_time&&p.default_time.slice(0,5)||"")+'"></div></div><div class="actions"><button id="mc" class="btn secondary">Cancelar</button><button id="ms" class="btn primary">Salvar</button></div></div>';document.body.appendChild(d);$("#mc",d).onclick=function(){d.remove()};$("#ms",d).onclick=async function(){var n=$("#mn",d).value.trim();try{if(p)await req("/rest/v1/patients?id=eq."+p.id+"&clinic_id=eq."+S.member.clinic_id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({full_name:n,phone:$("#mp",d).value||null,default_time:$("#mt",d).value||null})});else await req("/rest/v1/patients",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({clinic_id:S.member.clinic_id,full_name:n,phone:$("#mp",d).value||null,default_time:$("#mt",d).value||null,start_date:S.date})});d.remove();done()}catch(x){msg("#mm",x.message,false)}}}
async function patients(){S.patients=await getPatients(true)||[];var h='<div class="header"><div><div class="eyebrow">Cadastro</div><h1>Pacientes</h1><p>Cadastros e histórico.</p></div><button id="np2" class="btn primary">+ Novo paciente</button></div><section class="card panel"><div class="tablewrap"><div class="simple"><div class="head"><div>Paciente</div><div>Horário</div><div>Desde</div><div>Situação</div><div></div></div>'+S.patients.map(function(x){return '<div class="row"><div class="name"><strong>'+e(x.full_name)+'</strong><small>'+e(x.phone||"")+'</small></div><div>'+e((x.default_time||"").slice(0,5)||"—")+'</div><div>'+e(x.start_date.split("-").reverse().join("/"))+'</div><div>'+(x.active?"Ativo":"Inativo")+'</div><div><button class="btn secondary" data-ed="'+x.id+'">Editar</button> <button class="btn secondary" data-tg="'+x.id+'">'+(x.active?"Inativar":"Reativar")+'</button></div></div>'}).join("")+'</div></div></section>';$("#main").innerHTML=h;$("#np2").onclick=function(){modal(null,patients)};$$("[data-ed]").forEach(function(b){b.onclick=function(){modal(S.patients.find(function(x){return x.id===b.dataset.ed}),patients)}});$$("[data-tg]").forEach(function(b){b.onclick=async function(){var p=S.patients.find(function(x){return x.id===b.dataset.tg});await req("/rest/v1/patients?id=eq."+p.id+"&clinic_id=eq."+S.member.clinic_id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({active:!p.active})});patients()}})}
async function reports(){var b=bounds(S.month),a=await Promise.all([getPatients(true),req("/rest/v1/attendance_entries?select=patient_id,status&clinic_id=eq."+S.member.clinic_id+"&attendance_date=gte."+b.s+"&attendance_date=lt."+b.n)]),tot={};(a[1]||[]).forEach(function(x){if(!tot[x.patient_id])tot[x.patient_id]={present:0,absent:0};tot[x.patient_id][x.status]++});var rows=(a[0]||[]).map(function(x){var t=tot[x.id]||{present:0,absent:0},n=t.present+t.absent;return Object.assign({},x,t,{rate:n?Math.round(t.present/n*100):0})});$("#main").innerHTML='<div class="header"><div><div class="eyebrow">Análise mensal</div><h1>Relatórios</h1></div><div style="display:flex;gap:7px"><input id="mo" class="input" type="month" value="'+S.month+'"><button id="om" class="btn secondary">Abrir</button></div></div><section class="card panel"><div class="tablewrap"><div class="report"><div class="head"><div>Paciente</div><div>Presenças</div><div>Faltas</div><div>Taxa</div><div>Situação</div></div>'+rows.map(function(x){return '<div class="row"><div>'+e(x.full_name)+'</div><div class="green">'+x.present+'</div><div class="red">'+x.absent+'</div><div>'+x.rate+'%</div><div>'+(x.active?"Ativo":"Inativo")+'</div></div>'}).join("")+'</div></div></section>';$("#om").onclick=function(){S.month=$("#mo").value||S.month;reports()}}
function settings(){var days=S.settings.operating_weekdays||[1,2,4,5],can=S.member.role==="owner"||S.member.role==="admin";$("#main").innerHTML='<div class="header"><div><div class="eyebrow">Preferências</div><h1>Configurações</h1></div></div><div class="settings"><section class="card"><h2>Clínica</h2><div id="sm"></div><div class="field"><label>Nome</label><input id="sn" class="input" value="'+e(cname())+'" '+(can?"":"disabled")+'></div><div class="field"><label>Dias de atendimento</label><div class="days">'+[[1,"Seg"],[2,"Ter"],[3,"Qua"],[4,"Qui"],[5,"Sex"],[6,"Sáb"],[0,"Dom"]].map(function(x){return '<button data-d="'+x[0]+'" class="'+(days.includes(x[0])?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div></div>'+(can?'<button id="ss" class="btn primary">Salvar</button>':"")+'</section><section class="card"><h2>Segurança</h2><p>RLS ativo, dados separados por clínica, auditoria de alterações e sem prontuário clínico neste módulo.</p></section></div>';if(can){$$("[data-d]").forEach(function(b){b.onclick=function(){b.classList.toggle("on")}});$("#ss").onclick=async function(){var d=$$("[data-d].on").map(function(b){return Number(b.dataset.d)});try{await req("/rest/v1/clinics?id=eq."+S.member.clinic_id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({name:$("#sn").value.trim()})});await req("/rest/v1/clinic_settings?clinic_id=eq."+S.member.clinic_id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({timezone:"America/Sao_Paulo",operating_weekdays:d})});msg("#sm","Configurações salvas.",true);S.settings.operating_weekdays=d;S.member.clinics={name:$("#sn").value.trim()}}catch(x){msg("#sm",x.message,false)}}}}
boot();
</script>
