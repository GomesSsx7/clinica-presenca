.login-v2-brandtext span{display:block;font-size:17px;color:#d8e8fb;margin:0}
.login-v2-brandtext strong{display:block;font-size:28px;margin:0;color:#fff}

.login-v2-features{display:grid;gap:12px;max-width:575px}
.login-v2-feature{display:flex;align-items:center;gap:14px;padding:11px 13px;border:1px solid rgba(143,193,255,.08);border-radius:16px;background:rgba(255,255,255,.035)}

.login-v2-feature strong{display:block;font-size:14px}.login-v2-feature p{margin:3px 0 0!important;font-size:12px!important;line-height:1.4!important;color:#aebfd4!important}

.login-v2-card .login-v2-eyebrow{margin:0 0 11px;color:#2670d8;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.login-v2-card h2{margin:0 0 8px;font-size:30px;letter-spacing:-.025em;color:#10284d}
.login-v2-subtitle{margin:0 0 28px;color:#70819a;font-size:14px}

.login-v2-field label{font-size:12px;font-weight:850;color:#203754}

.login-v2-input:focus-within{border-color:#73a8ee;box-shadow:0 0 0 4px rgba(38,112,216,.09)}

/* App V2 — visual system */
:root{
  --bg:#f4f7fb;
  --nav:#0a2142;
  --blue:#256fe7;
  --blue2:#3a8af7;
  --ink:#12233f;
  --muted:#74839a;
  --line:#e2e8f0;
  --green:#16835a;
  --red:#c8444e;
  --amber:#a56c0b;
  --shadow:0 10px 32px rgba(23,45,78,.07);
}
body{background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{grid-template-columns:264px minmax(0,1fr);background:var(--bg)}
.nav{background:linear-gradient(180deg,#081d3b 0%,#0c294e 60%,#0a2242 100%);padding:20px 14px 16px;border-right:1px solid rgba(255,255,255,.04);box-shadow:10px 0 36px rgba(8,29,59,.06)}
.app-brand{display:flex;align-items:center;gap:11px;padding:2px 9px 20px}
.app-brand-logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#39d5e8,#2a79ff);box-shadow:0 9px 22px rgba(38,119,231,.28);flex:0 0 auto}
.app-brand-logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.app-brand-name{line-height:1.05}.app-brand-name span{display:block;color:#adc2db;font-size:11px;font-weight:700}.app-brand-name strong{display:block;color:#fff;font-size:18px;margin-top:3px;letter-spacing:-.02em}
.nav-section-title{padding:5px 11px 8px;color:#6f88a7;font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.nav button[data-v]{display:flex;align-items:center;gap:10px;color:#b9c9dc;padding:11px 12px;border-radius:11px;margin:2px 0;font-size:13px;transition:.15s ease}
.nav button[data-v] svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.nav button[data-v]:hover{background:rgba(255,255,255,.065);color:#fff}
.nav button[data-v].active{background:linear-gradient(90deg,rgba(51,126,231,.26),rgba(51,126,231,.12));color:#fff;box-shadow:inset 3px 0 0 #56a0ff}
.clinicbar{margin:3px 5px 18px;padding:10px 11px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.065);border-radius:12px}
.clinicbar label{font-size:9px;color:#7891ae;letter-spacing:.12em}
