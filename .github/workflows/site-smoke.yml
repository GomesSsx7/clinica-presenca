name: Site smoke checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/site_smoke.mjs
      - name: Responsive viewport checks
        shell: bash
        run: |
          node scripts/make_responsive_probe.mjs
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          for size in 500,844 768,1024 1366,768; do
            echo "Checking viewport $size"
            OUT="$($CHROME --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=600 --window-size="$size" --dump-dom "file://$PWD/.responsive-probe.html" 2>/dev/null)"
            if [[ "$OUT" != *'data-responsive="ok"'* ]]; then
              INFO="${OUT#*data-responsive-info=}"
              echo "Responsive check failed at $size: ${INFO:0:500}"
              exit 1
            fi
          done
